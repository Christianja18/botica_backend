spring.application.name=botica
server.port=${SERVER_PORT:8082}
spring.config.import=optional:file:.env[.properties]

# Configuracion MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/botica_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.try-it-out-enabled=true

# Seguridad
botica.auth.jwt.secret=${BOTICA_JWT_SECRET:}
botica.auth.session-hours=${BOTICA_SESSION_HOURS:8}
botica.security.cors.allowed-origins=${BOTICA_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:4200}

# Backups de base de datos
botica.backup.storage-directory=C:/copia
botica.backup.timezone=America/Lima
botica.backup.schema-script-path=../scriptbotica.sql
botica.backup.full.cron=0 0 2 1 1,4,7,10 *
botica.backup.inserts.cron=0 30 2 1 1,4,7,10 *
