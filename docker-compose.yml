version: '5.1.1'
services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - DB_URL=jdbc:mysql://db:3307/botica_db?useSSL=false&serverTimezone=UTC
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - SERVER_PORT=8080
      - JPA_SHOW_SQL=false
  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: botica_db
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
volumes:
  db-data: