version: '3.9'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    networks:
      - botica-net
    environment:
      - DB_URL=jdbc:mysql://dbbotica:3306/botica_db
      - DB_USERNAME:root
      - DB_PASSWORD:root
      - SERVER_PORT:8080
      - JPA_SHOW_SQL:false
networks:
  botica-net:
    external: true